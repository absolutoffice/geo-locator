name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: dev-main
  XDEBUG_MODE: 'off'

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify installed PHP and dependency requirements
        run: composer check-platform-reqs

      - name: Run release quality gate
        run: composer check
